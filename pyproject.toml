[project]
name = "ap-management"
version = "0.4.5"
description = "AP Management repository"
authors = [{ name = "Lucas Peirone", email = "lucas.peirone@univ-grenoble-alpes.fr" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.14,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "agent-framework-core>=1.9.0",
    "agent-framework-ollama>=1.0.0b260521",
    "agent-framework-openai>=1.8.2",
    "deepdiff>=9.1.0",
    "fastapi>=0.136.3",
    "litellm>=1.87.0",
    "microsoft-kiota-http>=1.10.2",
    "microsoft-kiota-serialization-form>=1.10.2",
    "microsoft-kiota-serialization-json>=1.10.2",
    "microsoft-kiota-serialization-multipart>=1.10.2",
    "microsoft-kiota-serialization-text>=1.10.2",
    "moma-domain>=2.7.2",
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-aiohttp-client==0.64b0",
    "opentelemetry-instrumentation-aiohttp-server==0.64b0",
    "opentelemetry-instrumentation-asyncio==0.64b0",
    "opentelemetry-instrumentation-click==0.64b0",
    "opentelemetry-instrumentation-dbapi==0.64b0",
    "opentelemetry-instrumentation-exceptions==0.64b0",
    "opentelemetry-instrumentation-fastapi==0.64b0",
    "opentelemetry-instrumentation-grpc==0.64b0",
    "opentelemetry-instrumentation-httpx==0.64b0",
    "opentelemetry-instrumentation-jinja2==0.64b0",
    "opentelemetry-instrumentation-logging==0.64b0",
    "opentelemetry-instrumentation-openai-v2>=2.4b0",
    "opentelemetry-instrumentation-requests==0.64b0",
    "opentelemetry-instrumentation-sqlite3==0.64b0",
    "opentelemetry-instrumentation-starlette==0.64b0",
    "opentelemetry-instrumentation-threading==0.64b0",
    "opentelemetry-instrumentation-tortoiseorm==0.64b0",
    "opentelemetry-instrumentation-urllib==0.64b0",
    "opentelemetry-instrumentation-urllib3==0.64b0",
    "opentelemetry-instrumentation-wsgi==0.64b0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "structlog>=25.5.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "pytest-asyncio>=1.3.0",
    "mkdocs>=1.6.1",
    "mike>=2.1.3",
    "neoteroi-mkdocs>=1.2.0",
    "pymdown-extensions>=10.20",
    "pytest-repeat>=0.9.4",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.2.3",
    "testcontainers>=4.14.2",
    "torch>=2.12.1",
    "sentence-transformers>=5.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
py-modules = ["ap_management"]

[tool.pytest.ini_options]
testpaths = ["tests"]
#addopts = "-n auto --maxprocesses=10"


[tool.uv.sources]
moma-domain = { url = "https://github.com/datagems-eosc/moma-management/releases/download/v2.9.0/moma_domain-2.9.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
