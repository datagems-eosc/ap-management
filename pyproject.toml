[project]
name = "ap-management"
version = "1.0.0"
description = "AP Management repository"
authors = [{ name = "Lucas Peirone", email = "lucas.peirone@univ-grenoble-alpes.fr" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "deepdiff>=8.6.1",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.128.0",
    "neo4j>=6.0.3",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "testcontainers[neo4j]>=4.14.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
py-modules = ["ap_management"]

[tool.pytest.ini_options]
testpaths = ["tests"]
