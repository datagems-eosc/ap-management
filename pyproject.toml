[project]
name = "ap-management"
version = "0.4.5"
description = "AP Management repository"
authors = [{ name = "Lucas Peirone", email = "lucas.peirone@univ-grenoble-alpes.fr" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.14,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "deepdiff>=9.1.0",
    "fastapi>=0.136.3",
    "litellm>=1.87.0",
    "microsoft-kiota-http>=1.10.2",
    "microsoft-kiota-serialization-form>=1.10.2",
    "microsoft-kiota-serialization-json>=1.10.2",
    "microsoft-kiota-serialization-multipart>=1.10.2",
    "microsoft-kiota-serialization-text>=1.10.2",
    "moma-domain>=2.7.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "structlog>=25.5.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "pytest-asyncio>=1.3.0",
    "mkdocs>=1.6.1",
    "mike>=2.1.3",
    "neoteroi-mkdocs>=1.2.0",
    "pymdown-extensions>=10.20",
    "pytest-repeat>=0.9.4",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.2.3",
    "testcontainers>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
py-modules = ["ap_management"]

[tool.pytest.ini_options]
testpaths = ["tests"]
#addopts = "-n auto --maxprocesses=10"


[tool.uv.sources]
moma-domain = { url = "https://github.com/datagems-eosc/moma-management/releases/download/v2.8.0/moma_domain-2.8.0-py3-none-any.whl" }
